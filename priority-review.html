<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priority Review | HEXA Matrix Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="priority-review.css">
</head>
<body>
  <main class="shell review-shell">
    <header class="masthead"><div><p class="kicker">Hoyoung</p><h1>Priority Review</h1></div><a href="index.html">Tracker</a></header>
    <div class="review-grid">
      <section class="panel">
        <h2>Priority draft</h2>
        <label>Mode<select id="mode"><option value="hecate_heroic">GMS Hecate / Heroic</option><option value="hecate_interactive">GMS Hecate / Interactive</option><option value="lotus_heroic" selected>GMS Lotus / Heroic</option><option value="lotus_interactive">GMS Lotus / Interactive</option><option value="taotie_heroic">KMS Taotie / Heroic</option><option value="taotie_interactive">KMS Taotie / Interactive</option></select></label>
        <label>Priority name<input id="name" type="text"></label>
        <label>Source link or note<input id="source" type="text"></label>
        <details class="import-panel"><summary>Import Maple Scouter response</summary>
          <label>Request payload JSON<textarea id="payload" spellcheck="false" placeholder="Paste the Request payload once to check for new orders"></textarea></label>
          <button id="retrieve" type="button">Check Maple Scouter</button>
          <label>HEXA order response JSON<textarea id="response" spellcheck="false" placeholder="Paste the response from Maple Scouter Network → Response"></textarea></label>
          <button id="inspect" type="button">Compare with current order</button>
          <div id="unknown" hidden><h3>New skills to name</h3><p>Confirm the short label, display name and skill type before downloading the draft.</p><div id="unknown-list"></div></div>
        </details>
        <label>Upgrade order <small>One step per line: Harmony, 1</small><textarea id="steps" spellcheck="false"></textarea></label>
        <div class="actions"><button id="review" type="button">Review changes</button><button id="download" type="button">Download draft</button></div>
        <p id="status" role="status"></p>
        <p class="fine">The draft stays in this browser. A reviewed GitHub update publishes it to the tracker.</p>
      </section>
      <section class="panel">
        <h2>Display names</h2>
        <div id="names"></div>
      </section>
    </div>
  </main>
  <script type="module" src="priority-review.js"></script>
</body>
</html>
