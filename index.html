<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEXA Matrix Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="kicker">MapleStory / HEXA Matrix</p>
        <h1>HEXA Matrix Tracker</h1>
      </div>
      <div class="version"><span id="version-name">GMS / Lotus</span></div>
    </header><p id="priority-sync" role="status" class="fine"></p>

    <div class="toolbar">
      <label>Class<select id="class"><option value="hoyoung">Hoyoung</option><option value="ren" disabled>Ren</option></select></label>
      <label>Update<select id="patch"></select></label>
      <fieldset class="world-picker"><legend>Priority (World)</legend><label><input type="radio" name="world" value="heroic" checked><span>Fragments (Heroic)</span></label><label><input type="radio" name="world" value="interactive"><span>Sol Erda (Interactive)</span></label></fieldset>
      <label id="version-picker" hidden>Priority version<select id="priority-version"></select></label>
    </div>

    <div class="workspace">
      <aside class="inputs">
        <section class="panel">
          <div class="panel-head"><h2>Current HEXA Matrix</h2><button id="reset" type="button">Reset</button></div>
          <div class="column-head"><span>node</span><span>level</span></div>
          <div id="nodes" class="node-list"></div>
          <div class="group-label">HEXA Stat</div>
          <div class="stat-list">
            <div class="stat-row"><span class="stat-name">HEXA Stat I</span><input data-stat="HEXA Stat I" aria-label="HEXA Stat I level" type="number" min="0" max="20" value="0"><label class="stat-unlocked"><input data-stat-unlocked="HEXA Stat I" aria-label="HEXA Stat I unlocked" type="checkbox"> Unlocked</label></div>
            <div class="stat-row"><span class="stat-name">HEXA Stat II</span><input data-stat="HEXA Stat II" aria-label="HEXA Stat II level" type="number" min="0" max="20" value="0"><label class="stat-unlocked"><input data-stat-unlocked="HEXA Stat II" aria-label="HEXA Stat II unlocked" type="checkbox"> Unlocked</label></div>
            <div class="stat-row"><span class="stat-name">HEXA Stat III</span><input data-stat="HEXA Stat III" aria-label="HEXA Stat III level" type="number" min="0" max="20" value="0"><label class="stat-unlocked"><input data-stat-unlocked="HEXA Stat III" aria-label="HEXA Stat III unlocked" type="checkbox"> Unlocked</label></div>
          </div>
        </section>
      </aside>

      <div class="results">
        <section class="panel priority-panel">
          <div class="panel-head"><h2>Upgrade Priority</h2></div>
          <div id="next-upgrade" class="next-upgrade"></div>
          <div class="priority-controls"><span id="progress" class="quiet"></span><label class="toggle"><input id="hideDone" type="checkbox" checked> Hide completed</label></div>
          <div class="table-wrap">
            <table class="priority-table">
              <thead><tr><th>#</th><th>Node</th><th>Target</th><th><span class="material-heading"><img src="assets/sol-erda.png" alt=""><span class="visually-hidden">Sol Erda</span><span class="material-fallback" aria-hidden="true">Sol Erda</span></span></th><th><span class="material-heading"><img src="assets/sol-erda-fragment.png" alt=""><span class="visually-hidden">Fragments</span><span class="material-fallback" aria-hidden="true">Fragments</span></span></th></tr></thead>
              <tbody id="priority"></tbody>
            </table>
          </div>
        </section>
      </div>

      <aside class="quickstats">
        <section class="panel">
          <h2>HEXA Matrix Summary</h2>
          <div id="completion" class="completion"></div>
          <div class="totals" id="totals"></div>
        </section>
        <section class="panel calculator-panel">
          <h2>Calculator</h2>
          <div class="resources">
            <label>Fragments owned <input id="owned" type="number" min="0" value="0"></label>
            <label>Fragments per day <input id="perday" type="number" min="0" value="0"></label>
          </div>
          <div class="include-option"><label class="toggle"><input id="includeJanus" type="checkbox"> Include Sol Janus in completion and spent totals</label></div>
          <div id="time-estimate" class="time-estimate" hidden></div>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
