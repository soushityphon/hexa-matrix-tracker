<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEXA Matrix Tracker</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">MapleStory</p><h1>HEXA Matrix Tracker</h1><p>Hoyoung Scouter priority and material planner.</p></div><div class="controls"><label>Class<select disabled><option>Hoyoung</option><option>Ren, coming soon</option></select></label><label>Scouter mode<select id="mode"><option value="heroic">Heroic, fragment limited</option><option value="interactive">Interactive, Sol Erda limited</option></select></label></div></header><section class="layout"><div><section class="card"><div class="section-head"><h2>Current HEXA levels</h2><button id="reset" class="ghost">Reset</button></div><div id="nodes" class="nodes"></div><div class="stat-grid"><label>HEXA Stat I<input data-stat="HEXA Stat I" type="number" min="0" max="20" value="0"></label><label>HEXA Stat II<input data-stat="HEXA Stat II" type="number" min="0" max="20" value="0"></label><label>HEXA Stat III<input data-stat="HEXA Stat III" type="number" min="0" max="20" value="0"></label></div></section><section class="card"><h2>Resources</h2><div class="stat-grid"><label>Fragments owned<input id="owned" type="number" min="0" value="0"></label><label>Fragments per day<input id="perday" type="number" min="0" value="0"></label></div></section></div><div><section class="card sticky"><h2>Quick stats</h2><div id="quick"></div></section></div></section><section class="card"><div class="section-head"><div><h2>Scouter priority</h2><p class="muted">Checkpoints stay compact. Intermediate levels are costed behind the scenes.</p></div></div><div class="priority-tools"><label><input id="hideDone" type="checkbox" checked> Hide completed checkpoints</label></div><div id="priority" class="priority"></div></section></main><script type="module" src="app.js"></script></body></html>
